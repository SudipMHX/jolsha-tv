<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1522" />
      <stop offset="45%" stop-color="#080C14" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>

    <!-- Radial Amber Atmosphere Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FF9E1B" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#FF5722" stop-opacity="0.10" />
      <stop offset="75%" stop-color="#FF3D00" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#04060A" stop-opacity="0" />
    </radialGradient>

    <!-- Flame Aura Gradient -->
    <linearGradient id="flameGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFC86B" />
      <stop offset="35%" stop-color="#FF9E1B" />
      <stop offset="85%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#D83B01" />
    </linearGradient>

    <!-- Wing Wave Arc Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC86B" />
      <stop offset="50%" stop-color="#FF9E1B" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>

    <!-- Metallic Gold Wordmark Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Accent S Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC86B" />
      <stop offset="100%" stop-color="#FF9E1B" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141C2B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0C121D" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="1200" height="500" fill="url(#bgGrad)" />

  <!-- 2. Ambient Radial Glow -->
  <rect width="1200" height="500" fill="url(#centerGlow)" />

  <!-- 3. Ambient Structural Lines (Subtle TV grid aesthetics) -->
  <g stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1.5">
    <line x1="0" y1="125" x2="1200" y2="125" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="900" y1="0" x2="900" y2="500" />
  </g>

  <!-- Subtle diagonal ambient beams -->
  <path d="M-100,500 L350,0 L420,0 L-30,500 Z" fill="#FFFFFF" fill-opacity="0.015" />
  <path d="M850,500 L1250,50 L1320,50 L920,500 Z" fill="#FFFFFF" fill-opacity="0.012" />

  <!-- 4. Top Badge: NATIVE ANDROID TV -->
  <g transform="translate(600, 52)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#141C2B" stroke="#263449" stroke-width="1" />
    <circle cx="-110" cy="0" r="4" fill="#00E676" />
    <text x="-95" y="4.5" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">NATIVE ANDROID TV</text>
    <text x="50" y="4.5" fill="#FF9E1B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" letter-spacing="2">API 24+</text>
  </g>

  <!-- 5. Central Logo Emblem (Flame + Spark + Broadcast Wings) -->
  <g transform="translate(600, 150)" filter="url(#shadow)">
    <!-- Broadcast Waves Outer Left -->
    <path d="M-80,-25 C-98,-5 -98,25 -80,45" fill="none" stroke="url(#wingGrad)" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.4" />
    <!-- Broadcast Waves Inner Left -->
    <path d="M-60,-15 C-72,-2 -72,18 -60,33" fill="none" stroke="url(#wingGrad)" stroke-width="5" stroke-linecap="round" stroke-opacity="0.85" />

    <!-- Broadcast Waves Inner Right -->
    <path d="M60,-15 C72,-2 72,18 60,33" fill="none" stroke="url(#wingGrad)" stroke-width="5" stroke-linecap="round" stroke-opacity="0.85" />
    <!-- Broadcast Waves Outer Right -->
    <path d="M80,-25 C98,-5 98,25 80,45" fill="none" stroke="url(#wingGrad)" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.4" />

    <!-- Flame Body -->
    <path d="M0,-60 C14,-32 50,-8 50,26 C50,56 28,78 0,78 C-28,78 -50,56 -50,26 C-50,-2 -22,-24 -12,-46 C-12,-46 -16,-22 -2,-16 C8,-12 14,-26 0,-60 Z"
          fill="url(#flameGrad)" />

    <!-- Inner Core Play Spark (Hardware Playhead Symbol) -->
    <polygon points="-6,-2 14,12 -6,26" fill="#FFFFFF" filter="url(#glow)" />
  </g>

  <!-- 6. Wordmark "JOLSHA" -->
  <g transform="translate(600, 290)">
    <text x="0" y="0" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif"
          font-size="64" font-weight="900" letter-spacing="12" fill="url(#textGrad)">
      JOL<tspan fill="url(#accentGrad)">S</tspan>HA
    </text>
  </g>

  <!-- 7. Bengali Script Subtitle -->
  <g transform="translate(600, 330)">
    <text x="0" y="0" text-anchor="middle"
          font-family="'Hind Siliguri', 'Kalpurush', 'SolaimanLipi', -apple-system, sans-serif"
          font-size="20" font-weight="600" letter-spacing="6" fill="#FFB84D" fill-opacity="0.95">
      জলসা টিভি • প্রিমিয়াম অ্যান্ড্রয়েড টিভি প্লেয়ার
    </text>
  </g>

  <!-- 8. Feature Chips Container -->
  <g transform="translate(600, 395)">
    <!-- Chip 1: Media3 ExoPlayer -->
    <g transform="translate(-390, 0)">
      <rect x="0" y="0" width="180" height="38" rx="8" fill="url(#cardBg)" stroke="#233145" stroke-width="1" />
      <circle cx="22" cy="19" r="4" fill="#FF9E1B" />
      <text x="36" y="23" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Media3 ExoPlayer</text>
    </g>

    <!-- Chip 2: 100% D-Pad Remote -->
    <g transform="translate(-195, 0)">
      <rect x="0" y="0" width="180" height="38" rx="8" fill="url(#cardBg)" stroke="#233145" stroke-width="1" />
      <circle cx="22" cy="19" r="4" fill="#FF9E1B" />
      <text x="36" y="23" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">100% D-Pad Remote</text>
    </g>

    <!-- Chip 3: M3U / M3U8 Engine -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="38" rx="8" fill="url(#cardBg)" stroke="#233145" stroke-width="1" />
      <circle cx="22" cy="19" r="4" fill="#FF9E1B" />
      <text x="36" y="23" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">M3U / M3U8 Engine</text>
    </g>

    <!-- Chip 4: BDIX / Local ISP -->
    <g transform="translate(195, 0)">
      <rect x="0" y="0" width="195" height="38" rx="8" fill="url(#cardBg)" stroke="#FF9E1B" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="22" cy="19" r="4" fill="#00E676" />
      <text x="36" y="23" fill="#FFD599" font-family="-apple-system, sans-serif" font-size="12" font-weight="800">AmberIT &amp; BDIX ISPs</text>
    </g>
  </g>

  <!-- 9. Footer Specification Line -->
  <g transform="translate(600, 465)">
    <text x="0" y="0" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="11.5" font-weight="600" letter-spacing="2" fill="#64748B">
      KOTLIN • CLEAN ARCHITECTURE • ZERO JANK • LOW-LATENCY LIVE STREAMING
    </text>
  </g>
</svg>
